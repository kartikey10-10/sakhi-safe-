name: Deploy download website

on:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure public repository identity
        working-directory: website
        env:
          REPOSITORY: ${{ github.repository }}
        run: node -e "require('fs').writeFileSync('public/site-config.json', JSON.stringify({repository: process.env.REPOSITORY}))"
      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Validate latest APK URL and QR generation
        working-directory: website
        run: npm test
      - name: Build website
        working-directory: website
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
